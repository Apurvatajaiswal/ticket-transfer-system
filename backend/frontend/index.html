<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IRCTC Clone</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      border-radius: 15px;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 22px;
    }

    .ticket-card {
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">TICKET TRANSFER</span>
  </div>
</nav>

<!-- HERO SECTION -->
<section class="hero">
  <div class="card p-4 shadow" style="width: 400px;">
    <h4 class="mb-3 text-center">Search Tickets</h4>

    <input id="source" class="form-control mb-2" placeholder="From">
    <input id="destination" class="form-control mb-3" placeholder="To">

    <button onclick="searchTicket()" class="btn btn-warning w-100">
      Search
    </button>
  </div>
</section>

<!-- RESULT SECTION -->
<div class="container mt-4">
  <h4>Available Tickets</h4>
  <ul id="ticketList" class="list-group"></ul>
</div>

<!-- JS -->
<script>
function searchTicket() {
  let source = document.getElementById("source").value;
  let destination = document.getElementById("destination").value;

  fetch(`http://127.0.0.1:8000/search-ticket?source=${source}&destination=${destination}`)
    .then(res => res.json())
    .then(data => {
      let list = document.getElementById("ticketList");
      list.innerHTML = "";

      if (data.length === 0) {
        list.innerHTML = "<li class='list-group-item'>No tickets found</li>";
        return;
      }

      data.forEach(ticket => {
        let li = document.createElement("li");
        li.className = "list-group-item ticket-card";

        li.innerHTML = `
          <strong>${ticket.train_name || "Train"}</strong><br>
          ${ticket.source} → ${ticket.destination}<br>
          Seat: ${ticket.seat_number || "N/A"}
        `;

        list.appendChild(li);
      });
    })
    .catch(err => {
      console.error(err);
      alert("Backend not connected ❌");
    });
}
</script>

</body>
</html>
